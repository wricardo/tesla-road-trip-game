---
name: Deploy

"on":
  push:
    branches: [main]

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Build binary (linux/arm64)
        run: GOOS=linux GOARCH=arm64 go build -o /tmp/tesla-road-trip .

      - name: Package
        run: |
          mkdir -p /tmp/tesla-deploy/frontend /tmp/tesla-deploy/sessions
          cp /tmp/tesla-road-trip /tmp/tesla-deploy/tesla-road-trip
          cp -r maps /tmp/tesla-deploy/maps
          cp -r frontend/build /tmp/tesla-deploy/frontend/build
          tar czf /tmp/deploy.tgz -C /tmp/tesla-deploy .

      # Setup SSH once — used by both Upload and Install steps.
      # Use a pinned known_hosts entry from secrets to prevent MITM and avoid
      # runtime key discovery drift.
      - name: Setup SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          EC2_PORT: ${{ vars.EC2_PORT }}
          EC2_SSH_USER: ${{ vars.EC2_SSH_USER }}
        run: |
          set -euo pipefail
          : "${EC2_HOST:?missing EC2_HOST secret}"
          : "${EC2_SSH_KEY:?missing EC2_SSH_KEY secret}"
          : "${EC2_KNOWN_HOSTS:?missing EC2_KNOWN_HOSTS secret}"
          EC2_PORT="${EC2_PORT:-22}"
          EC2_SSH_USER="${EC2_SSH_USER:-ubuntu}"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify SSH access
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ vars.EC2_PORT }}
          EC2_SSH_USER: ${{ vars.EC2_SSH_USER }}
        run: |
          EC2_PORT="${EC2_PORT:-22}"
          EC2_SSH_USER="${EC2_SSH_USER:-ubuntu}"
          ssh -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -p "$EC2_PORT" \
            -i ~/.ssh/deploy_key \
            "$EC2_SSH_USER"@"$EC2_HOST" true

      - name: Upload to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ vars.EC2_PORT }}
          EC2_SSH_USER: ${{ vars.EC2_SSH_USER }}
        run: |
          EC2_PORT="${EC2_PORT:-22}"
          EC2_SSH_USER="${EC2_SSH_USER:-ubuntu}"
          scp -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -P "$EC2_PORT" \
            -i ~/.ssh/deploy_key \
            /tmp/deploy.tgz \
            "$EC2_SSH_USER"@"$EC2_HOST":/tmp/tesla-road-trip-game-deploy.tgz

      - name: Install and restart
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ vars.EC2_PORT }}
          EC2_SSH_USER: ${{ vars.EC2_SSH_USER }}
        run: |
          EC2_PORT="${EC2_PORT:-22}"
          EC2_SSH_USER="${EC2_SSH_USER:-ubuntu}"
          ssh -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -p "$EC2_PORT" \
            -i ~/.ssh/deploy_key \
            "$EC2_SSH_USER"@"$EC2_HOST" '
            sudo mkdir -p /opt/tesla-road-trip-game
            sudo tar xzf /tmp/tesla-road-trip-game-deploy.tgz \
              -C /opt/tesla-road-trip-game
            sudo chown -R ubuntu:ubuntu /opt/tesla-road-trip-game
            chmod +x /opt/tesla-road-trip-game/tesla-road-trip
            cp -f /opt/tesla-road-trip-game/tesla-road-trip /opt/tesla-road-trip-game/statefullgame
            chmod +x /opt/tesla-road-trip-game/statefullgame
            sudo mkdir -p /opt/tesla-road-trip-game/sessions
            sudo chown -R ubuntu:ubuntu /opt/tesla-road-trip-game/sessions
            sudo mkdir -p /etc/systemd/system/tesla-road-trip-game.service.d
            printf "%s\n" \
              "[Service]" \
              "WorkingDirectory=/opt/tesla-road-trip-game" \
              "Environment=SESSIONS_DIR=/opt/tesla-road-trip-game/sessions" \
              | sudo tee /etc/systemd/system/tesla-road-trip-game.service.d/persistence.conf >/dev/null
            sudo systemctl daemon-reload
            sudo systemctl restart tesla-road-trip-game.service
            systemctl is-active tesla-road-trip-game.service
          '

      - name: Smoke test deployed GraphQL API
        env:
          DEPLOY_BASE_URL: ${{ secrets.DEPLOY_BASE_URL }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          BASE_URL="${DEPLOY_BASE_URL:-}"
          if [ -z "$BASE_URL" ]; then
            : "${EC2_HOST:?missing EC2_HOST secret}"
            BASE_URL="http://$EC2_HOST"
          fi
          sleep 2
          response=$(curl -fsS "$BASE_URL/graphql" \
            -H 'content-type: application/json' \
            --data '{"query":"query { maps { mapId } }"}')
          echo "$response" | grep -q '"maps"'
