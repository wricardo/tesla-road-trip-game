name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Build frontend
      run: |
        npm --prefix frontend ci
        npm --prefix frontend run build

    - name: Build binary (linux/arm64)
      run: GOOS=linux GOARCH=arm64 go build -o /tmp/statefullgame .

    - name: Package
      run: |
        mkdir -p /tmp/tesla-deploy/frontend /tmp/tesla-deploy/sessions
        cp /tmp/statefullgame /tmp/tesla-deploy/statefullgame
        cp -r configs /tmp/tesla-deploy/configs
        cp -r frontend/build /tmp/tesla-deploy/frontend/build
        tar czf /tmp/deploy.tgz -C /tmp/tesla-deploy .

    - name: Upload to EC2
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      run: |
        echo "$EC2_SSH_KEY" > /tmp/deploy_key
        chmod 600 /tmp/deploy_key
        scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
          /tmp/deploy.tgz ubuntu@$EC2_HOST:/tmp/tesla-road-trip-game-deploy.tgz

    - name: Install and restart
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      run: |
        echo "$EC2_SSH_KEY" > /tmp/deploy_key
        chmod 600 /tmp/deploy_key
        ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key ubuntu@$EC2_HOST '
          sudo mkdir -p /opt/tesla-road-trip-game
          sudo tar xzf /tmp/tesla-road-trip-game-deploy.tgz -C /opt/tesla-road-trip-game
          sudo chown -R ubuntu:ubuntu /opt/tesla-road-trip-game
          chmod +x /opt/tesla-road-trip-game/statefullgame
          mkdir -p /opt/tesla-road-trip-game/sessions
          sudo systemctl restart tesla-road-trip-game.service
          systemctl is-active tesla-road-trip-game.service
        '
