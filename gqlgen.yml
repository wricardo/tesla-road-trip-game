schema:
  - graph/schema.graphqls

exec:
  filename: graph/generated/generated.go
  package: generated

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.IntID
      - github.com/99designs/gqlgen/graphql.Int64ID
      - github.com/99designs/gqlgen/graphql.Int32ID
  GameState:
    model: github.com/wricardo/tesla-road-trip-game/graph/model.GameState
    fields:
      grid:
        resolver: true
  GameMap:
    model: github.com/wricardo/tesla-road-trip-game/graph/model.GameMap
    fields:
      layout:
        resolver: true
